<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Medellín Weather</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Dynamic Background -->
    <div class="weather-bg" id="weather-bg">
        <div class="bg-overlay"></div>
        <div class="rain-container" id="rain-container"></div>
        <div class="clouds" id="clouds"></div>
    </div>

    <div class="app">
        <!-- Main Header -->
        <header class="main-header" id="main-header">
            <h1 class="city-name">Medellín</h1>
            <div class="temp-main" id="temp-main">--°</div>
            <div class="condition" id="condition">Loading</div>
            <div class="temp-range" id="temp-range">H:--° L:--°</div>
        </header>

        <!-- Hourly Forecast Card -->
        <section class="card hourly-card">
            <p class="hourly-summary" id="hourly-summary">Loading weather data...</p>
            <div class="hourly-scroll" id="hourly-scroll">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- 10-Day Forecast Card -->
        <section class="card forecast-card">
            <div class="card-title">
                <span class="card-icon">📅</span>
                <span>10-DAY FORECAST</span>
            </div>
            <div class="forecast-list" id="forecast-list">
                <!-- Filled by JS -->
            </div>
        </section>

        <!-- News Card -->
        <section class="card news-card">
            <div class="card-title">
                <span class="card-icon">📰</span>
                <span>MEDELLÍN NEWS</span>
            </div>
            <div class="news-list" id="news-list">
                <!-- Filled by JS -->
            </div>
        </section>

        <footer class="footer">
            <p>Open-Meteo · <a href="https://github.com/santiagorueda-lab">VaultGhost</a> ☢️</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
